<div class="overlay" (click)="$event.stopPropagation()">
  <div class="modal">
    <h2>Puzzle Complete!</h2>

    <div class="rating">{{ ratingStars }}</div>
    <div class="rating-label">{{ ratingLabel }}</div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value">{{ mistakes }}</span>
        <span class="stat-label">{{ mistakes === 1 ? 'Mistake' : 'Mistakes' }}</span>
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-primary" (click)="playAgain.emit()">Play Again</button>
      <button class="btn btn-secondary" (click)="nextPuzzle.emit()">Next Puzzle</button>
    </div>
  </div>
</div>
