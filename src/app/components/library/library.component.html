<div class="library-container">
  <div class="library-header">
    <h2>Puzzle Archive</h2>
  </div>

  <div class="filters">
    <label>
      Difficulty
      <select [(ngModel)]="difficultyFilter">
        <option value="all">All</option>
        <option value="1">Easy</option>
        <option value="2">Medium</option>
        <option value="3">Hard</option>
      </select>
    </label>
    <label>
      Status
      <select [(ngModel)]="completionFilter">
        <option value="all">All</option>
        <option value="completed">Completed</option>
        <option value="incomplete">Incomplete</option>
      </select>
    </label>
  </div>

  <div class="skeleton-list" *ngIf="loading" aria-hidden="true">
    <div class="skeleton-card" *ngFor="let card of skeletonCards">
      <div class="skeleton-line skeleton-line-title"></div>
      <div class="skeleton-line skeleton-line-sub"></div>
      <div class="skeleton-card-footer">
        <div class="skeleton-line skeleton-line-tag"></div>
        <div class="skeleton-line skeleton-line-btn"></div>
      </div>
    </div>
  </div>
  <p class="sr-only" *ngIf="loading">Loading archive...</p>
  <div class="error" *ngIf="error">{{ error }}</div>

  <div class="empty-state" *ngIf="!loading && !error && filteredPuzzles.length === 0">
    No puzzles match your filters.
  </div>

  <div class="puzzle-list" *ngIf="!loading && !error && filteredPuzzles.length > 0">
    <div class="puzzle-card" *ngFor="let puzzle of filteredPuzzles">
      <div class="card-title-row">
        <div>
          <h3>{{ puzzle.title }}</h3>
          <span class="puzzle-date">{{ formatDate(puzzle.date) }}</span>
        </div>
        <span class="completion-tag" [class.completed]="puzzle.completed">
          {{ puzzle.completed ? 'Completed' : 'Not solved' }}
        </span>
      </div>
      <p *ngIf="puzzle.description">{{ puzzle.description }}</p>
      <div class="card-footer">
        <span class="difficulty" [attr.data-difficulty]="puzzle.difficulty">{{ difficultyLabels[puzzle.difficulty] || 'Unknown' }}</span>
        <button type="button" (click)="playPuzzle(puzzle.id)">Play</button>
      </div>
    </div>
  </div>
</div>
