  <!--
    Umami analytics — cookieless, so no consent banner is required.

    data-auto-track="false": the app uses hash routing, which the tracker's
    automatic navigation detection does not follow (every route would be
    recorded as "/"). Page views are sent manually from AppComponent instead.

    data-domains: only report from the live site, so local dev and e2e runs
    do not pollute the numbers.
  -->
  <script defer src="https://cloud.umami.is/script.js" data-website-id="5261a900-0ef8-4549-badf-23b5bf4a9e88" data-auto-track="false" data-domains="cornerz.cc"></script>
  <script>
    // Apply a manually chosen theme before the app boots to avoid a flash
    // of the wrong theme. Kept in sync with ThemeService ('cornerz-theme').
    try {
      var theme = localStorage.getItem('cornerz-theme');
      if (theme === 'light' || theme === 'dark') {
        document.documentElement.dataset.theme = theme;
      }
    } catch (e) { /* storage unavailable: fall back to OS preference */ }
  </script>
